<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="512" height="512" rx="112" fill="none" stroke="url(#rose)" stroke-width="8" stroke-opacity="0.4" />

  <!-- Outer Glow Circle -->
  <circle cx="256" cy="220" r="130" fill="url(#rose)" opacity="0.15" filter="url(#glow)" />

  <!-- Stylized Diamond / Sparkle -->
  <path d="M 256 90 L 290 195 L 395 220 L 290 245 L 256 350 L 222 245 L 117 220 L 222 195 Z" fill="url(#rose)" filter="url(#glow)" />
  <path d="M 256 120 L 280 200 L 360 220 L 280 240 L 256 320 L 232 240 L 152 220 L 232 200 Z" fill="url(#gold)" opacity="0.9" />

  <!-- Smaller Accent Sparkle -->
  <path d="M 360 120 L 372 150 L 402 160 L 372 170 L 360 200 L 348 170 L 318 160 L 348 150 Z" fill="url(#gold)" />
  <path d="M 150 280 L 158 300 L 178 308 L 158 316 L 150 336 L 142 316 L 122 308 L 142 300 Z" fill="url(#rose)" />

  <!-- JAM Beauty Store Text -->
  <text x="256" y="415" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">JAM BEAUTY</text>
  <text x="256" y="455" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20" font-weight="600" fill="#fb7185" text-anchor="middle" letter-spacing="6">ENTERPRISE STORE</text>
</svg>
